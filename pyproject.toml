[project]
name = "mcp-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Calebe Prates", email = "eltoncalebeprates@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "mcp>=2.2.0",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
mcp-project = "mcp_project:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_project"]
