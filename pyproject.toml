[project]
name = "company-investigator-mcp"
version = "1.0.0"
description = "Company Investigator MCP - MCP server for public company intelligence, corporate relationships and evidence-based investigation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Calebe Prates", email = "eltoncalebeprates@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "osint",
    "cnpj",
    "brazil",
    "company-intelligence",
    "due-diligence",
    "pep",
    "datajud",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "mcp>=2.2.0",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://github.com/CalebePrates/company-investigator-mcp"
Repository = "https://github.com/CalebePrates/company-investigator-mcp"
Issues = "https://github.com/CalebePrates/company-investigator-mcp/issues"
Documentation = "https://github.com/CalebePrates/company-investigator-mcp#readme"
Changelog = "https://github.com/CalebePrates/company-investigator-mcp/blob/main/CHANGELOG.md"

[project.scripts]
company-investigator-mcp = "company_investigator:main"
company-investigator = "company_investigator:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# A distribuicao se chama `company-investigator-mcp`, mas o pacote importavel
# continua sendo `company_investigator` (o uv_build inferiria `company_investigator_mcp`).
module-name = "company_investigator"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["company_investigator"]
